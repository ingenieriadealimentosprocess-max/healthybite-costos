const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const x=parseFloat(String(v).replace(',','.'));return isFinite(x)?x:0};
const money=n=>'$ '+Math.round(n||0).toLocaleString('es-CO');
const pct=n=>(isFinite(n)?n:0).toLocaleString('es-CO',{maximumFractionDigits:1,minimumFractionDigits:1})+'%';
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
const insById=id=>S.ins.find(i=>i.id===id);
const compById=id=>S.comps.find(c=>c.id===id);
const dayById=id=>S.dias.find(d=>d.id===id);
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2600)}
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const weekday=f=>{try{return new Date(f+'T12:00:00').toLocaleDateString('es-CO',{weekday:'long'})}catch(e){return ''}};

/* ---------- Motor de costos ---------- */
const fam=u=>u==='und'?'u':'w';
const toBase=(q,u)=>(u==='kg'||u==='l')?q*1000:q;
function insBase(i){
  const b=toBase(i.cant||0,i.u);
  if(!(i.precio>0)||!(b>0))return{c:0,f:fam(i.u),pend:true};
  return{c:(i.precio/b)/(1-Math.min(i.merma||0,95)/100),f:fam(i.u),pend:false};
}
function lineCost(it){
  const i=insById(it.ins);
  if(!i)return{cost:0,warn:'Insumo eliminado'};
  const b=insBase(i);
  if(b.pend)return{cost:0,warn:'Sin precio'};
  if(fam(it.u)!==b.f)return{cost:0,warn:'Unidad incompatible'};
  return{cost:toBase(it.q||0,it.u)*b.c,warn:''};
}
function compCost(c){
  let t=0;const w=[];
  if(!c.items.length)w.push('Sin ingredientes');
  c.items.forEach(it=>{const r=lineCost(it);t+=r.cost;if(r.warn){const i=insById(it.ins);w.push((i?i.n:'?')+': '+r.warn)}else if(!(it.q>0)){const i=insById(it.ins);w.push((i?i.n:'?')+': sin cantidad')}});
  if(!(c.rinde>0))w.push('Falta indicar cuántas porciones rinde');
  const r=c.rinde>0?c.rinde:1;
  return{batch:t,porc:t/r,warns:w};
}
const full=x=>x*(1+S.cfg.mo/100)*(1+S.cfg.desv/100);
const netoDe=pvp=>pvp/(1+S.cfg.inc/100);
function semaforo(fc){
  if(!isFinite(fc)||fc<=0)return{c:'na',t:'Sin datos'};
  const o=S.cfg.fcObj;
  if(fc<=o+3)return{c:'ok',t:'En rango'};
  if(fc<=o+10)return{c:'rev',t:'Revisar'};
  return{c:'bad',t:'Crítico'};
}
function dayCalc(d){
  const P=d.prep>0?d.prep:(d.vend>0?d.vend:0),V=d.vend>0?d.vend:0;
  let ins=0,batch=0,warns=0,uso=0;const menu=[],usoSlot={};
  Object.keys(TIPOS).forEach(s=>{
    (d.sel[s]||[]).forEach(r=>{
      const c=compById(r.c);if(!c)return;
      const cc=compCost(c);ins+=cc.porc;
      batch+=cc.porc*(r.prep>0?r.prep:P);warns+=cc.warns.length;menu.push(c.n);
    });
    let t=0;((d.uso||{})[s]||[]).forEach(it=>{const r=lineCost(it);t+=r.cost;if(r.warn||!(it.q>0))warns++});
    usoSlot[s]=t;uso+=t;
    const nm=((d.info||{})[s]||{}).n;if(nm&&!(d.sel[s]||[]).some(r=>r.c))menu.push(nm);
  });
  batch+=uso;
  const teor=full(ins),batchF=full(batch);
  const real=V>0?batchF/V:null;
  let sobr=(V>0&&teor>0&&batchF>teor*V)?batchF-teor*V:0;
  Object.keys(TIPOS).forEach(s=>{const i=(d.info||{})[s]||{};if(i.total>0&&i.sobr>0)sobr+=full(usoSlot[s]||0)*Math.min(1,i.sobr/i.total)});
  const pvp=d.pvp>0?d.pvp:S.cfg.pvp,neto=pvp>0?netoDe(pvp):0;
  const val=V>0?Math.min(d.valera>0?d.valera:0,V):0,pvpV=S.cfg.pvpValera>0?S.cfg.pvpValera:0,netoV=pvpV>0?netoDe(pvpV):0;
  const ventas=(V>0&&neto>0)?(V-val)*neto+val*(netoV||neto):0;
  const netoP=(V>0&&neto>0)?ventas/V:neto;
  const base=real!=null?real:(teor>0?teor:null);
  const fcT=neto>0?teor/neto*100:0,fcR=(netoP>0&&real!=null)?real/netoP*100:0;
  const nm=real!=null?netoP:neto;
  const margen=(nm>0&&base!=null)?nm-base:0;
  const sug=teor>0&&S.cfg.fcObj>0?Math.ceil(teor/(S.cfg.fcObj/100)*(1+S.cfg.inc/100)/500)*500:0;
  return{P,V,val,pvpV,netoV,netoP,ins,uso,usoSlot,teor,batchF,real,sobr,pvp,neto,fcT,fcR,margen,hasBase:base!=null,margenPct:(nm>0&&base!=null)?margen/nm*100:0,sug,warns,menu,
    ventas,costoDia:batchF,utilDia:ventas-batchF};
}
function touchDay(d){snapDay(d);save()}
function snapDay(d){const c=dayCalc(d);d.snap={menu:c.menu,P:c.P,V:c.V,val:c.val,pvp:c.pvp,neto:c.neto,netoP:c.netoP,ins:c.ins,teor:c.teor,real:c.real,fcT:c.fcT,fcR:c.fcR,margen:c.margen,ventas:c.ventas,costoDia:c.costoDia,utilDia:c.utilDia}}
function ensureDefaults(){
  S.cfg=S.cfg||{};
  if(S.cfg.pvpValera==null)S.cfg.pvpValera=27900;
  if(S.cfg.boletin!==BOL_FECHA)applyBoletin(S);
  S.dias.forEach(d=>{if(!d.snap)snapDay(d)});
}

/* ---------- Render principal ---------- */
function render(){
  $('nav').innerHTML=TAB_LIST.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');
  const fn={dia:rDia,comps:rComps,ins:rIns,hist:rHist,cfg:rCfg}[tab];
  const y=window.scrollY;
  $('app').innerHTML=`<datalist id="insList">${S.ins.map(i=>`<option value="${esc(i.n)}">`).join('')}</datalist>`+fn();
  applyRO();
  window.scrollTo(0,y);
}
function go(t){tab=t;render();window.scrollTo(0,0)}

/* ---------- Almuerzo del día ---------- */
function compOptions(tipo,sel){
  const srt=a=>a.slice().sort((x,y)=>x.n.localeCompare(y.n,'es'));
  const opt=c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.n)}</option>`;
  let h='<option value="">— elegir —</option>'+srt(S.comps.filter(c=>c.tipo===tipo)).map(opt).join('');
  const o=srt(S.comps.filter(c=>c.tipo!==tipo));
  if(o.length)h+='<optgroup label="Otros tipos">'+o.map(opt).join('')+'</optgroup>';
  return h;
}
function rDia(){
  if(!curDay||!dayById(curDay))curDay=S.dias.length?S.dias.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha))[0].id:null;
  const days=S.dias.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha));
  let h=`<div class="card"><div class="row">
    <label class="f">Día registrado<select data-ro onchange="selDay(this.value)"><option value="">— ninguno —</option>${days.map(d=>`<option value="${d.id}" ${d.id===curDay?'selected':''}>${d.fecha} · ${esc(weekday(d.fecha))}</option>`).join('')}</select></label>
    <button class="b" onclick="newDay()">➕ Nuevo día (hoy)</button>
    ${curDay?`<button class="b s" onclick="dupDay()">📋 Copiar este menú a otra fecha</button><button class="b d" onclick="delDay()">Eliminar día</button>`:''}
  </div></div>`;
  if(!S.cfg.pvp&&!curDay)h+=`<div class="info">Paso 1: pulsa <b>Nuevo día</b>. Antes, en <b>Supuestos</b>, escribe el precio de venta del almuerzo. En <b>Componentes</b> completa las recetas y en <b>Insumos</b> los precios.</div>`;
  if(!curDay)return h+`<div class="card empty">Aún no hay un día abierto. Pulsa “Nuevo día” para armar el menú de hoy.</div>`;
  const d=dayById(curDay),c=dayCalc(d);
  h+=`<div class="grid"><div>`;
  h+=`<div class="card"><div class="row">
    <label class="f">Fecha<input type="date" value="${d.fecha}" onchange="setDay('fecha',this.value)"></label>
    <label class="f">Almuerzos preparados<input type="number" min="0" value="${d.prep||''}" onchange="setDay('prep',num(this.value))"></label>
    <label class="f">Almuerzos vendidos (total)<input type="number" min="0" value="${d.vend||''}" onchange="setDay('vend',num(this.value))"></label>
    <label class="f">De ellos, con valera (${money(S.cfg.pvpValera)})<input type="number" min="0" value="${d.valera||''}" placeholder="0" onchange="setDay('valera',num(this.value))"></label>
    <label class="f">Precio al público (con INC)<input type="number" min="0" step="100" style="width:140px" value="${d.pvp||''}" placeholder="${S.cfg.pvp||'ej. 28000'}" onchange="setDay('pvp',num(this.value))"></label>
    <label class="f" style="flex:1;min-width:160px">Nota<input value="${esc(d.nota||'')}" onchange="setDay('nota',this.value)" placeholder="opcional"></label>
  </div></div>`;
  Object.keys(TIPOS).forEach(s=>{
    const rows=d.sel[s]||[];
    h+=`<div class="card slot"><h3>${TIPOS[s]} <span>(cada fila = 1 porción por almuerzo)</span></h3>`;
    if(rows.length){
      h+=`<table><tr><th>Componente</th><th class="n">Porciones hechas</th><th class="n">Costo insumos / porción</th><th></th></tr>`;
      rows.forEach((r,i)=>{
        const cm=compById(r.c),cc=cm?compCost(cm):null;
        h+=`<tr><td><select style="width:100%" onchange="setRow('${s}',${i},'c',this.value)">${compOptions(s,r.c)}</select>${cc&&cc.warns.length?`<div class="warn" title="${esc(cc.warns.join('\n'))}">⚠ ${cc.warns.length} pendiente(s): ${esc(cc.warns.slice(0,2).join(' · '))}${cc.warns.length>2?'…':''}</div>`:''}</td>
        <td class="n"><input type="number" min="0" style="width:80px" value="${r.prep||''}" placeholder="${c.P||''}" onchange="setRow('${s}',${i},'prep',num(this.value))"></td>
        <td class="n">${cc?money(cc.porc):'—'}</td><td><button class="x" onclick="delRow('${s}',${i})">✕</button></td></tr>`;
      });
      h+=`</table>`;
    }
    h+=`<div style="margin-top:8px"><button class="b s" onclick="addRow('${s}')">＋ Agregar receta guardada</button> <button class="b s" onclick="newCompFrom('${s}')">✚ Crear componente nuevo</button></div>`;
    const info=(d.info&&d.info[s])||{},us=(d.uso&&d.uso[s])||[];
    const serv=(info.total>0&&info.porcion>0)?Math.max(0,(info.total-(info.sobr||0))/info.porcion):0;
    h+=`<div style="margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)"><b>Lo que se usó hoy</b> <span class="mut">(igual que la hoja de cocina)</span>
      <div class="row" style="margin:8px 0"><label class="f" style="flex:1;min-width:150px">¿Qué se preparó?<input style="width:100%" value="${esc(info.n||'')}" onchange="setInfo('${s}','n',this.value)"></label>
      <label class="f">Total preparado (g/ml)<input type="number" min="0" style="width:100px" value="${info.total||''}" onchange="setInfo('${s}','total',num(this.value))"></label>
      <label class="f">Porción (g/ml)<input type="number" min="0" style="width:85px" value="${info.porcion||''}" onchange="setInfo('${s}','porcion',num(this.value))"></label>
      <label class="f">Sobrante (g/ml)<input type="number" min="0" style="width:90px" value="${info.sobr||''}" onchange="setInfo('${s}','sobr',num(this.value))"></label></div>
      ${serv?`<div class="mut" style="margin-bottom:6px">≈ ${Math.round(serv)} porciones servidas según total, sobrante y porción</div>`:''}`;
    if(us.length){
      h+=`<table><tr><th>Insumo usado</th><th class="n">Cantidad</th><th>Unidad</th><th class="n">Costo</th><th></th></tr>`;
      us.forEach((it,i)=>{const ins=insById(it.ins),lc=lineCost(it);
        h+=`<tr><td>${esc(ins?ins.n:'(eliminado)')}${lc.warn?`<div class="warn">⚠ ${lc.warn}</div>`:(!(it.q>0)?'<div class="warn">⚠ sin cantidad</div>':'')}</td>
        <td class="n"><input type="number" min="0" step="any" style="width:90px" value="${it.q||''}" onchange="setUso('${s}',${i},'q',num(this.value))"></td>
        <td><select onchange="setUso('${s}',${i},'u',this.value)">${['g','kg','ml','l','und'].map(u=>`<option ${it.u===u?'selected':''}>${u}</option>`).join('')}</select></td>
        <td class="n">${money(lc.cost)}</td><td><button class="x" onclick="delUso('${s}',${i})">✕</button></td></tr>`});
      h+=`<tr><td colspan="3"><b>Insumos usados en esta parte</b></td><td class="n"><b>${money(c.usoSlot[s]||0)}</b></td><td></td></tr></table>`;
    }
    h+=`<div class="row" style="margin-top:8px"><label class="f" style="flex:1;min-width:160px">Agregar insumo usado<input id="ua_n_${s}" list="insList" placeholder="escribe para buscar…" style="width:100%"></label>
      <label class="f">Cantidad<input id="ua_q_${s}" type="number" min="0" step="any" style="width:90px"></label>
      <label class="f">Unidad<select id="ua_u_${s}"><option>g</option><option>kg</option><option>ml</option><option>l</option><option>und</option></select></label>
      <button class="b" onclick="addUso('${s}')">Agregar</button></div></div></div>`;
  });
  h+=`</div><div class="sticky">`;
  const sm=semaforo(c.real!=null?c.fcR:c.fcT);
  h+=`<div class="card"><h3>Resultado del día</h3>
    ${c.uso>0?`<div class="kv"><span>Insumos usados hoy (según la hoja)</span><b>${money(c.uso)}</b></div>
    <div class="kv"><span class="mut">+ Mano de obra (${S.cfg.mo}%) y desviación (${S.cfg.desv}%)</span><b>${money(full(c.uso)-c.uso)}</b></div>
    <div class="kv t"><span><b>Costo total del día</b></span><b>${money(c.batchF)}</b></div>`:''}
    ${c.ins>0?`<div class="kv"><span>Costo de insumos por almuerzo (recetas guardadas)</span><b>${money(c.ins)}</b></div>
    <div class="kv t"><span><b>Costo total por almuerzo (teórico)</b></span><b>${money(c.teor)}</b></div>`:''}
    ${c.real!=null?`<div class="kv t"><span><b>Costo real por almuerzo vendido</b></span><b>${money(c.real)}</b></div>
    ${c.sobr>0?`<div class="kv"><span class="mut">De ese costo, aprox. lo que quedó de sobrante</span><b>${money(c.sobr)}</b></div>`:''}`:`<div class="warn" style="margin:6px 0">Escribe los <b>almuerzos vendidos</b> (arriba) para ver el costo por almuerzo.</div>`}
    <div style="height:8px"></div>
    <div class="kv"><span>Precio al público</span><b>${c.pvp?money(c.pvp):'— falta —'}</b></div>
    <div class="kv"><span class="mut">Precio sin INC (${S.cfg.inc}%)</span><b>${c.neto?money(c.neto):'—'}</b></div>
    ${c.val>0?`<div class="kv"><span>Con valera (${c.val} almuerzos) al público</span><b>${money(c.pvpV)}</b></div>
    <div class="kv"><span class="mut">Precio promedio sin INC (${c.V-c.val} normales + ${c.val} valera)</span><b>${money(c.netoP)}</b></div>`:''}
    <div class="kv"><span>Food cost teórico</span><b>${c.neto?pct(c.fcT):'—'}</b></div>
    ${c.real!=null?`<div class="kv"><span>Food cost real</span><b>${c.neto?pct(c.fcR):'—'}</b></div>`:''}
    <div class="kv t"><span><b>Margen por almuerzo</b></span><b>${(c.neto&&c.hasBase)?money(c.margen)+' ('+pct(c.margenPct)+')':'—'}</b></div>
    <div style="margin:10px 0"><span class="pill ${sm.c}">${sm.t}</span> <span class="mut">objetivo food cost ${S.cfg.fcObj}%</span></div>
    ${c.sug?`<div class="kv"><span>Precio sugerido para cumplir el objetivo</span><b>${money(c.sug)}</b></div>`:''}
  </div>`;
  if(c.V>0)h+=`<div class="card"><h3>Totales del día</h3>
    <div class="kv"><span>Ventas (sin INC)${c.val>0?` · ${c.V-c.val} normales + ${c.val} con valera`:''}</span><b>${money(c.ventas)}</b></div>
    <div class="kv"><span>Costo total de lo preparado</span><b>${money(c.costoDia)}</b></div>
    <div class="kv t"><span><b>Utilidad bruta</b></span><b>${money(c.utilDia)}</b></div></div>`;
  if(c.warns)h+=`<div class="info">⚠ Hay ${c.warns} dato(s) pendiente(s) en las recetas de este menú (precios sin definir, ingredientes sin cantidad o porciones sin indicar). El costo mostrado está <b>incompleto</b> hasta corregirlos.</div>`;
  h+=`</div></div>`;
  return h;
}
function newDay(){
  let d=S.dias.find(x=>x.fecha===today());
  if(!d){d={id:uid(),fecha:today(),prep:0,vend:0,valera:0,pvp:0,nota:'',sel:{entrada:[],proteina:[],acomp:[],ensalada:[]},uso:{},info:{}};S.dias.push(d);touchDay(d)}
  curDay=d.id;render()
}
function selDay(id){curDay=id||null;render()}
function delDay(){if(!confirm('¿Eliminar este día del historial?'))return;S.dias=S.dias.filter(d=>d.id!==curDay);curDay=null;save();render()}
function dupDay(){
  const o=dayById(curDay);const f=prompt('Fecha del nuevo día (AAAA-MM-DD):',today());if(!f||!/^\d{4}-\d{2}-\d{2}$/.test(f))return;
  const n=JSON.parse(JSON.stringify(o));n.id=uid();n.fecha=f;n.vend=0;n.nota='';delete n.snap;S.dias.push(n);touchDay(n);curDay=n.id;render()
}
function setDay(f,v){const d=dayById(curDay);d[f]=v;touchDay(d);render()}
function addRow(s){const d=dayById(curDay);(d.sel[s]=d.sel[s]||[]).push({c:'',prep:0});save();render()}
function delRow(s,i){const d=dayById(curDay);d.sel[s].splice(i,1);touchDay(d);render()}
function setRow(s,i,f,v){const d=dayById(curDay);d.sel[s][i][f]=v;touchDay(d);render()}
function findOrCreateIns(name,u){
  let ins=S.ins.find(i=>norm(i.n)===norm(name));
  if(!ins){ins={id:uid(),n:name,cat:'Sin clasificar',precio:0,cant:1,u:(u==='und'?'und':(u==='ml'||u==='l')?'l':'kg'),merma:0,nota:''};S.ins.push(ins);toast('Insumo nuevo creado: falta su precio en la pestaña Insumos')}
  return ins;
}
function setInfo(s,f,v){const d=dayById(curDay);d.info=d.info||{};(d.info[s]=d.info[s]||{})[f]=v;touchDay(d);render()}
function addUso(s){
  const d=dayById(curDay),name=$('ua_n_'+s).value.trim(),q=num($('ua_q_'+s).value),u=$('ua_u_'+s).value;
  if(!name){toast('Escribe el nombre del insumo');return}
  const ins=findOrCreateIns(name,u);
  d.uso=d.uso||{};(d.uso[s]=d.uso[s]||[]).push({ins:ins.id,q:q,u:u});touchDay(d);render()
}
function setUso(s,i,f,v){const d=dayById(curDay);d.uso[s][i][f]=v;touchDay(d);render()}
function delUso(s,i){const d=dayById(curDay);d.uso[s].splice(i,1);touchDay(d);render()}
function newCompFrom(s){
  const n=prompt('Nombre del componente nuevo ('+TIPOS[s]+'):');if(!n)return;
  const c={id:uid(),tipo:s,n:n.trim(),rinde:0,items:[],nota:''};S.comps.push(c);
  const d=dayById(curDay);const rows=d.sel[s]=d.sel[s]||[];const empty=rows.find(r=>!r.c);if(empty)empty.c=c.id;else rows.push({c:c.id,prep:0});
  touchDay(d);openC.add(c.id);compF={tipo:'all',q:''};tab='comps';render();toast('Componente creado: completa sus ingredientes y porciones')
}

/* ---------- Componentes (recetas) ---------- */
function rComps(){
  const q=norm(compF.q);
  let list=S.comps.filter(c=>(compF.tipo==='all'||c.tipo===compF.tipo)&&(!q||norm(c.n).includes(q))).sort((a,b)=>a.n.localeCompare(b.n,'es'));
  let h=`<div class="card"><div class="row"><label class="f" style="flex:1;min-width:200px">Buscar<input data-ro value="${esc(compF.q)}" onchange="compF.q=this.value;render()" placeholder="ej. pollo, ahuyama…"></label>
    <button class="b" onclick="newComp()">➕ Nuevo componente</button></div>
    <div class="chips" style="margin-top:10px"><span class="chip ${compF.tipo==='all'?'on':''}" onclick="compF.tipo='all';render()">Todos (${S.comps.length})</span>${Object.keys(TIPOS).map(t=>`<span class="chip ${compF.tipo===t?'on':''}" onclick="compF.tipo='${t}';render()">${TIPOS[t]} (${S.comps.filter(c=>c.tipo===t).length})</span>`).join('')}</div>
    <div class="mut">Un componente es una receta completa (ej. “Pollo a la naranja”): sus ingredientes en las cantidades de UN lote y cuántas porciones rinde ese lote.</div></div>`;
  if(!list.length)h+=`<div class="card empty">No hay componentes con ese filtro.</div>`;
  list.forEach(c=>{
    const cc=compCost(c),op=openC.has(c.id);
    h+=`<details class="comp" ${op?'open':''} ontoggle="toggleC('${c.id}',this.open)"><summary><span class="tag">${TIPOS[c.tipo].split(' ')[0]}</span><b>${esc(c.n)}</b>
      ${cc.warns.length?`<span class="warn">⚠ ${cc.warns.length} pendiente(s)</span>`:'<span class="pill ok">completo</span>'}
      <span>${c.rinde>0?money(cc.porc)+' / porción':'—'}</span></summary><div class="body">`;
    h+=`<div class="row" style="margin:10px 0"><label class="f" style="flex:1;min-width:200px">Nombre<input style="width:100%" value="${esc(c.n)}" onchange="setComp('${c.id}','n',this.value)"></label>
      <label class="f">Tipo<select onchange="setComp('${c.id}','tipo',this.value)">${Object.keys(TIPOS).map(t=>`<option value="${t}" ${c.tipo===t?'selected':''}>${TIPOS[t]}</option>`).join('')}</select></label>
      <label class="f">El lote rinde (porciones)<input type="number" min="0" value="${c.rinde||''}" onchange="setComp('${c.id}','rinde',num(this.value))"></label></div>`;
    if(c.items.length){
      h+=`<table><tr><th>Ingrediente</th><th class="n">Cantidad</th><th>Unidad</th><th class="n">Costo</th><th></th></tr>`;
      c.items.forEach((it,i)=>{
        const ins=insById(it.ins),lc=lineCost(it);
        h+=`<tr><td>${esc(ins?ins.n:'(eliminado)')}${lc.warn?`<div class="warn">⚠ ${lc.warn}</div>`:''}</td>
        <td class="n"><input type="number" min="0" step="any" style="width:90px" value="${it.q||''}" onchange="setLine('${c.id}',${i},'q',num(this.value))"></td>
        <td><select onchange="setLine('${c.id}',${i},'u',this.value)">${['g','kg','ml','l','und'].map(u=>`<option ${it.u===u?'selected':''}>${u}</option>`).join('')}</select></td>
        <td class="n">${money(lc.cost)}</td><td><button class="x" onclick="delLine('${c.id}',${i})">✕</button></td></tr>`;
      });
      h+=`<tr><td colspan="3"><b>Costo de insumos del lote</b></td><td class="n"><b>${money(cc.batch)}</b></td><td></td></tr>
      <tr><td colspan="3">Costo de insumos por porción</td><td class="n"><b>${c.rinde>0?money(cc.porc):'—'}</b></td><td></td></tr>
      <tr><td colspan="3">Costo total por porción (con mano de obra y desviación)</td><td class="n"><b>${c.rinde>0?money(full(cc.porc)):'—'}</b></td><td></td></tr></table>`;
    }
    h+=`<div class="row" style="margin-top:10px"><label class="f" style="flex:1;min-width:200px">Agregar ingrediente<input id="al_n_${c.id}" list="insList" placeholder="escribe para buscar…" style="width:100%"></label>
      <label class="f">Cantidad<input id="al_q_${c.id}" type="number" min="0" step="any"></label>
      <label class="f">Unidad<select id="al_u_${c.id}"><option>g</option><option>kg</option><option>ml</option><option>l</option><option>und</option></select></label>
      <button class="b" onclick="addLine('${c.id}')">Agregar</button></div>
    <div style="margin-top:12px;display:flex;gap:8px"><button class="b s" onclick="dupComp('${c.id}')">Duplicar</button><button class="b d" onclick="delComp('${c.id}')">Eliminar componente</button></div>
    <div class="mut" style="margin-top:6px">Las cantidades van en peso <b>neto</b> (ya pelado/limpio). La merma se configura en Insumos.</div>`;
    h+=`</div></details>`;
  });
  return h;
}
function toggleC(id,o){o?openC.add(id):openC.delete(id)}
function newComp(){const n=prompt('Nombre del componente:');if(!n)return;const t=compF.tipo==='all'?'proteina':compF.tipo;const c={id:uid(),tipo:t,n:n.trim(),rinde:0,items:[],nota:''};S.comps.push(c);openC.add(c.id);save();render()}
function setComp(id,f,v){compById(id)[f]=v;save();render()}
function dupComp(id){const o=compById(id);const n=JSON.parse(JSON.stringify(o));n.id=uid();n.n=o.n+' (copia)';S.comps.push(n);openC.add(n.id);save();render()}
function delComp(id){
  const used=S.dias.some(d=>Object.values(d.sel).some(r=>r.some(x=>x.c===id)));
  if(!confirm(used?'Este componente se usó en días del historial. ¿Eliminarlo igual? (los días conservan su costo guardado)':'¿Eliminar este componente?'))return;
  S.comps=S.comps.filter(c=>c.id!==id);S.dias.forEach(d=>Object.values(d.sel).forEach(r=>r.forEach(x=>{if(x.c===id)x.c=''})));save();render()
}
function addLine(id){
  const c=compById(id),name=$('al_n_'+id).value.trim(),q=num($('al_q_'+id).value),u=$('al_u_'+id).value;
  if(!name){toast('Escribe el nombre del ingrediente');return}
  const ins=findOrCreateIns(name,u);
  c.items.push({ins:ins.id,q:q,u:u});save();openC.add(id);render()
}
function setLine(id,i,f,v){compById(id).items[i][f]=v;save();render()}
function delLine(id,i){compById(id).items.splice(i,1);save();render()}

/* ---------- Insumos ---------- */
function rIns(){
  const q=norm(insF.q);
  const pend=S.ins.filter(i=>insBase(i).pend).length;
  let list=S.ins.filter(i=>(!q||norm(i.n).includes(q)||norm(i.cat).includes(q))&&(!insF.pend||insBase(i).pend)).sort((a,b)=>(insBase(b).pend-insBase(a).pend)||a.n.localeCompare(b.n,'es'));
  let h=`<div class="card"><div class="row"><label class="f" style="flex:1;min-width:200px">Buscar<input data-ro value="${esc(insF.q)}" onchange="insF.q=this.value;render()"></label>
    <label class="f" style="flex-direction:row;align-items:center;gap:6px"><input data-ro type="checkbox" ${insF.pend?'checked':''} onchange="insF.pend=this.checked;render()"> Solo sin precio (${pend})</label>
    <button class="b" onclick="newIns()">➕ Nuevo insumo</button>
    <button class="b s" onclick="cargarBoletin()">📥 Cargar precios Corabastos (${BOL_FECHA})</button></div>
    <div class="mut" style="margin-top:8px">Escribe el precio tal como compras: “$ 18.000 por 1 kg”, “$ 6.500 por 500 g”, “$ 1.500 por 1 und”. La <b>merma %</b> es lo que se pierde al limpiar/pelar (ej. ahuyama 25%): el sistema encarece el costo real del insumo.</div></div>`;
  h+=`<div class="card"><table><tr><th>Insumo</th><th>Categoría</th><th class="n">Precio de compra</th><th class="n">Por cantidad</th><th>Unidad</th><th class="n">Merma %</th><th class="n">Costo real /g·ml·und</th><th></th></tr>`;
  list.forEach(i=>{
    const b=insBase(i);
    h+=`<tr><td><input style="width:100%;min-width:150px" value="${esc(i.n)}" onchange="setIns('${i.id}','n',this.value)">${i.nota?`<div class="mut" style="font-size:11px">${esc(i.nota)}</div>`:''}</td>
    <td><input style="width:105px" value="${esc(i.cat)}" onchange="setIns('${i.id}','cat',this.value)"></td>
    <td class="n"><input type="number" min="0" step="any" style="width:105px;${b.pend?'border-color:var(--warn);background:var(--warn2)':''}" value="${i.precio||''}" placeholder="falta" onchange="setIns('${i.id}','precio',num(this.value))"></td>
    <td class="n"><input type="number" min="0" step="any" style="width:70px" value="${i.cant}" onchange="setIns('${i.id}','cant',num(this.value))"></td>
    <td><select onchange="setIns('${i.id}','u',this.value)">${['g','kg','ml','l','und'].map(u=>`<option ${i.u===u?'selected':''}>${u}</option>`).join('')}</select></td>
    <td class="n"><input type="number" min="0" max="90" style="width:65px" value="${i.merma||''}" onchange="setIns('${i.id}','merma',num(this.value))"></td>
    <td class="n">${b.pend?'<span class="warn">pendiente</span>':'$ '+b.c.toLocaleString('es-CO',{maximumFractionDigits:2})}</td>
    <td><button class="x" onclick="delIns('${i.id}')">✕</button></td></tr>`;
  });
  h+=`</table>${list.length?'':'<div class="empty">Sin resultados.</div>'}</div>`;
  return h;
}
function newIns(){const n=prompt('Nombre del insumo:');if(!n)return;S.ins.push({id:uid(),n:n.trim(),cat:'Sin clasificar',precio:0,cant:1,u:'kg',merma:0,nota:''});insF={q:n.trim(),pend:false};save();render()}
function setIns(id,f,v){const i=insById(id);i[f]=v;if(f==='precio'||f==='cant'||f==='u'){i.manual=true;i.nota=''}save();render()}
function cargarBoletin(){
  const man=S.ins.filter(i=>i.manual&&BOLETIN.some(b=>b[0].toLowerCase()===i.n.toLowerCase())).length;
  if(!confirm('Se cargarán los precios del boletín de Corabastos del '+BOL_FECHA+' ('+BOLETIN.length+' insumos).'+(man?'\n\n'+man+' de ellos tienen un precio editado a mano; ¿sobrescribirlos también? (Aceptar = sí, Cancelar = no, solo se actualizan los demás)':''))){
    if(man){const n=applyBoletin(S,false);save();toast(n+' precios actualizados (se respetaron los editados a mano)');render()}return}
  const n=applyBoletin(S,true);save();toast(n+' precios actualizados desde Corabastos');render()
}
function delIns(id){
  const used=S.comps.filter(c=>c.items.some(it=>it.ins===id));
  if(used.length){alert('No se puede eliminar: se usa en '+used.length+' componente(s), por ejemplo “'+used[0].n+'”.');return}
  if(!confirm('¿Eliminar este insumo?'))return;S.ins=S.ins.filter(i=>i.id!==id);save();render()
}

/* ---------- Historial ---------- */
function rHist(){
  const months=[...new Set(S.dias.map(d=>d.fecha.slice(0,7)))].sort().reverse();
  let list=S.dias.filter(d=>d.snap&&(histMonth==='all'||d.fecha.startsWith(histMonth))).sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const withV=list.filter(d=>d.snap.V>0);
  const vend=withV.reduce((s,d)=>s+d.snap.V,0),ventas=withV.reduce((s,d)=>s+d.snap.ventas,0),costo=withV.reduce((s,d)=>s+d.snap.costoDia,0);
  let h=`<div class="card"><div class="row"><label class="f">Mes<select data-ro onchange="histMonth=this.value;render()"><option value="all">Todos</option>${months.map(m=>`<option ${m===histMonth?'selected':''}>${m}</option>`).join('')}</select></label>
    <button class="b s" onclick="recalcAll()">🔄 Recalcular con precios actuales</button><button data-ro class="b s" onclick="exportCSV()">⬇ Exportar CSV (Excel)</button></div>
    <div class="mut" style="margin-top:8px">Cada día guarda el costo del momento en que se registró; si cambias precios después, usa “Recalcular”.</div></div>`;
  h+=`<div class="tiles"><div class="tile"><span>Días con venta</span><b>${withV.length}</b></div><div class="tile"><span>Almuerzos vendidos</span><b>${vend.toLocaleString('es-CO')}</b></div>
    <div class="tile"><span>Ventas sin INC</span><b>${money(ventas)}</b></div><div class="tile"><span>Costo total</span><b>${money(costo)}</b></div>
    <div class="tile"><span>Utilidad bruta</span><b>${money(ventas-costo)}</b></div><div class="tile"><span>Food cost real del período</span><b>${ventas>0?pct(costo/ventas*100):'—'}</b></div></div>`;
  if(!list.length)return h+`<div class="card empty">Todavía no hay días registrados.</div>`;
  h+=`<div class="card"><table><tr><th>Fecha</th><th>Menú</th><th class="n">Vend.</th><th class="n">Costo real / almuerzo</th><th class="n">Precio sin INC</th><th class="n">Food cost</th><th class="n">Margen / almuerzo</th><th></th></tr>`;
  list.forEach(d=>{const s=d.snap,fc=s.real!=null?s.fcR:s.fcT,sm=semaforo(fc);
    h+=`<tr style="cursor:pointer" onclick="curDay='${d.id}';go('dia')"><td>${d.fecha}<div class="mut">${esc(weekday(d.fecha))}</div></td><td>${esc(s.menu.join(' · '))}</td><td class="n">${s.V||'—'}</td>
    <td class="n">${s.real!=null?money(s.real):(s.teor>0?money(s.teor):'<span class="warn">sin ventas</span>')}</td><td class="n">${s.neto?money(s.V>0&&s.netoP?s.netoP:s.neto):'—'}</td><td class="n">${(s.neto&&fc>0)?pct(fc):'—'}</td><td class="n">${(s.neto&&fc>0)?money(s.margen):'—'}</td><td><span class="pill ${sm.c}">${sm.t}</span></td></tr>`});
  return h+`</table></div>`;
}
function recalcAll(){S.dias.forEach(touchDay);toast('Historial recalculado con los precios actuales');render()}
function exportCSV(){
  const rows=[['Fecha','Menu','Preparados','Vendidos','Con valera','Precio publico','Precio sin INC','Costo insumos por almuerzo','Costo total teorico','Costo real por almuerzo','Food cost','Margen por almuerzo','Ventas sin INC','Costo del dia','Utilidad bruta']];
  S.dias.filter(d=>d.snap).sort((a,b)=>a.fecha.localeCompare(b.fecha)).forEach(d=>{const s=d.snap;rows.push([d.fecha,s.menu.join(' | '),s.P,s.V,s.val||0,s.pvp,Math.round(s.neto),Math.round(s.ins),Math.round(s.teor),s.real!=null?Math.round(s.real):'',(s.real!=null?s.fcR:s.fcT).toFixed(1),Math.round(s.margen),Math.round(s.ventas),Math.round(s.costoDia),Math.round(s.utilDia)])});
  const csv='﻿'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n');
  dl('Historial_almuerzos_HealthyBite.csv',csv,'text/csv')
}
function dl(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:type+';charset=utf-8'}));a.download=name;a.click()}

/* ---------- Supuestos y respaldo ---------- */
function rCfg(){
  const c=S.cfg;
  return `<div class="card"><h3>Supuestos de costeo</h3><div class="row">
    <label class="f">Precio del almuerzo al público (con INC)<input type="number" step="100" style="width:170px" value="${c.pvp||''}" onchange="setCfg('pvp',num(this.value))" placeholder="ej. 28000"></label>
    <label class="f">Precio con valera (con INC)<input type="number" step="100" style="width:150px" value="${c.pvpValera||''}" onchange="setCfg('pvpValera',num(this.value))"></label>
    <label class="f">% Mano de obra<input type="number" step="0.5" value="${c.mo}" onchange="setCfg('mo',num(this.value))"></label>
    <label class="f">% Desviación / merma<input type="number" step="0.5" value="${c.desv}" onchange="setCfg('desv',num(this.value))"></label>
    <label class="f">% Impuesto al consumo<input type="number" step="0.5" value="${c.inc}" onchange="setCfg('inc',num(this.value))"></label>
    <label class="f">% Food cost objetivo<input type="number" step="0.5" value="${c.fcObj}" onchange="setCfg('fcObj',num(this.value))"></label></div>
    <p class="mut">Método (igual al libro de costeo de la carta): costo de insumos → + mano de obra → + desviación = costo total. Food cost = costo total ÷ precio sin INC. Semáforo: “En rango” hasta objetivo + 3 puntos, “Revisar” hasta objetivo + 10, “Crítico” por encima. El 21%, el 5% y el 30% vienen del costeo previo: conviene validarlos con el cliente.</p></div>
  <div class="card"><h3>Respaldo de datos</h3><p class="mut">Los datos se guardan en este navegador. Descarga un respaldo de vez en cuando (o para pasar la información a otro computador).</p>
    <div class="row"><button data-ro class="b" onclick="exportJSON()">⬇ Descargar respaldo</button>
    <label class="b s" style="cursor:pointer">⬆ Restaurar respaldo<input type="file" accept=".json" style="display:none" onchange="importJSON(this)"></label>
    <button class="b d" onclick="resetAll()">Borrar todo y empezar de cero</button></div></div>`;
}
function setCfg(f,v){S.cfg[f]=v;S.dias.forEach(touchDay);save();render()}
function exportJSON(){dl('Respaldo_HealthyBite_'+today()+'.json',JSON.stringify(S),'application/json')}
function importJSON(inp){
  const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.ins||!o.comps||!o.dias)throw 0;if(!confirm('Esto reemplaza los datos actuales. ¿Continuar?'))return;S=o;save();curDay=null;render();toast('Respaldo restaurado')}catch(e){alert('El archivo no es un respaldo válido.')}};
  r.readAsText(f)
}
function resetAll(){if(!confirm('Se borrarán insumos, componentes e historial y se cargará la lista inicial. ¿Seguro?'))return;S=seed();curDay=null;save();render()}

ensureDefaults();
refreshLockUI();
render();
if(cloudOn()){
  cloudPull().then(ch=>{if(ch)render()});
  setInterval(()=>{
    if(EDITABLE)return;
    cloudPull().then(ch=>{const a=document.activeElement;if(ch&&!(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)))render()});
  },15000);
}
</script>
</body>
</html>
